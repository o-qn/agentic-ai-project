<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf }}">
  <title>{% block title %}Recruitment dashboard{% endblock %}</title>
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <aside class="sidebar">
    <div class="department-header"><span class="department-label">Human resources</span><a class="department-home" href="/" aria-label="Recruitment dashboard home">Recruitment</a></div>
    <span class="nav-label">NAVIGATION</span>
    {% block navigation %}{% endblock %}
    <div class="sidebar-bottom"><a class="owner-link" href="{% block footer_url %}/owner{% endblock %}">{% block footer_label %}Administration ↗{% endblock %}</a></div>
  </aside>
  <main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
  <div id="toast" role="alert" hidden></div>
  <script src="/static/common.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
